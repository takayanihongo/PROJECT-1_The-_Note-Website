<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — Catatan Baru</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="main new-note-page">
  <div class="content">
    <a href="index.html" class="see-all">← Kembali ke dashboard</a>
    <div class="page-header">
      <h1>Catatan baru</h1>
      <p class="hero-sub">Simpan ide atau materi belajar berikutnya.</p>
    </div>
    <form class="new-note-form" data-new-note-form>
      <label>Judul<input name="title" required maxlength="120" /></label>
      <label>Topik<select name="category"><option value="javascript">JavaScript</option><option value="python">Python</option><option value="networking">Networking</option><option value="linux">Linux</option><option value="git">Git</option></select></label>
      <label>Tag<input name="tags" placeholder="contoh: async, promise" /></label>
      <label>Isi catatan<textarea name="body" rows="10" required></textarea></label>
      <div class="quick-actions"><button class="btn btn-primary" type="submit">Simpan catatan</button><a class="btn" href="index.html">Batal</a></div>
    </form>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
